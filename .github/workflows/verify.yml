name: Verify Retro Arcade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source contents (offline)
        run: python3 scripts/release_audit.py --check
      - name: Verify deployable artifacts when mGBA is bundled
        run: |
          if [ -f web/mgba/manifest.json ]; then
            python3 scripts/release_audit.py --release
          else
            echo "mGBA WASM not yet built; OpenWrt APK release stays blocked"
          fi
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax
        run: |
          node --check web/app.mjs
          node --check web/fullscreen.mjs
          node --check web/controller.mjs
          node --check web/chip8.mjs
          node --check web/demo.mjs
          node --check web/systems.mjs
          node --check web/battery-store.mjs
          node --check web/mgba-player.mjs

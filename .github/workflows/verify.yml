name: Verify Retro Arcade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source contents (offline)
        run: python3 scripts/release_audit.py --check
      - name: Verify deployable artifacts when JSNES is vendored
        run: |
          if [ -f web/vendor/jsnes/manifest.json ]; then
            python3 scripts/release_audit.py --release
          else
            echo "JSNES 2.1.0 not vendored; OpenWrt APK release stays blocked"
          fi
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/fullscreen.js
          node --check web/controller.js
          node --check web/chip8.js
          node --check web/demo.js
          node --check web/systems.js
          node --check web/battery-store.js
          node --check web/mgba-player.js

          node --check web/jsnes-player.js
          node --check web/nes-audio.js

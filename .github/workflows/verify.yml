name: Verify Retro Arcade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source contents (offline)
        run: python3 scripts/release_audit.py --check
      - name: Verify existing released emulator integrity
        run: python3 scripts/release_audit.py --existing
      - name: Verify optional MAME binary only when locally built
        run: |
          if [ -f web/mame/manifest.json ]; then
            python3 scripts/release_audit.py --release
          else
            echo 'MAME WASM not yet locally built; Makefile release gate will reject APK.'
          fi
      - name: Verify browser cache hashes
        run: python3 scripts/cache_bust.py --check
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/fullscreen.js
          node --check web/controller.js
          node --check web/chip8.js
          node --check web/demo.js
          node --check web/systems.js
          node --check web/battery-store.js
          node --check web/save-session.js
          node --check web/mgba-player.js

          node --check web/jsnes-player.js
          node --check web/nes-audio.js
          node --check web/sega-player.js
          node --check web/mame-player.js
          node --check web/mame/runner.js
      - name: Install Chromium browser E2E runner (tests only)
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: HTTP Chromium desktop/mobile smoke tests
        run: python3 tests/browser_e2e.py -v
